# Trigger: any `v*` release tag (e.g. v1.40.0).
# Can also be queued manually from the ADO UI.
trigger:
  tags:
    include:
      - v*
    exclude:
      - v*-*

pr: none

parameters:
- name: releaseChannel
  displayName: "IMPORTANT: set this to 'canary' when triggering manually"
  type: string
  default: stable
  values:
  - stable
  - canary

resources:
  repositories:
  - repository: 1esPipelines
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1esPipelines
  parameters:
    pool:
      name: DevDivPlaywrightAzurePipelinesUbuntu2204
      os: linux
    sdl:
      sourceAnalysisPool:
        name: DevDivPlaywrightAzurePipelinesWindows2022
        # The image must be windows-based due to restrictions of the SDL tools. See: https://aka.ms/AAo6v8e
        os: windows
      suppression:
        suppressionFile: $(Build.SourcesDirectory)\.azure-pipelines\guardian\SDL\.gdnsuppress
    stages:
    - stage: Publish
      jobs:
      - job: PublishDocker
        displayName: "Publish Docker images to ACR"
        # arm64 images are cross-built under QEMU emulation, which is slow.
        timeoutInMinutes: 360
        steps:
        - checkout: self
          displayName: "Checkout code"

        - task: UseDotNet@2
          displayName: "Use .NET 8 SDK"
          inputs:
            packageType: sdk
            version: 8.x

        # All NuGet restores (Playwright.Tooling and the `dotnet publish` in
        # utils/docker/build.sh) go through the DevDiv_PublicPackages feed instead of
        # nuget.org (SFI-ES4.2.4): the copied nuget.config is discovered from every
        # project directory and its <clear /> drops the nuget.org source inherited
        # from the user-level config. NuGetAuthenticate@1 installs the credential
        # provider that authenticates to the feed.
        - bash: cp .azure-pipelines/nuget.config nuget.config
          displayName: "Use DevDiv_PublicPackages as the only NuGet source"

        - task: NuGetAuthenticate@1
          displayName: "Authenticate NuGet to DevDiv_PublicPackages feed"

        # Playwright.Tooling fetches playwright-core with `npm pack`, which picks up
        # the registry and credentials from this .npmrc.
        - task: UseNode@1
          displayName: "Install Node.js"
          inputs:
            version: '24.x'

        - bash: echo "registry=https://devdiv.pkgs.visualstudio.com/DevDiv/_packaging/DevDiv_PublicPackages/npm/registry/" >> .npmrc
          displayName: "Point npm registry at DevDiv_PublicPackages feed"

        - task: npmAuthenticate@0
          displayName: "Authenticate npm to DevDiv_PublicPackages feed"
          inputs:
            workingFile: .npmrc

        # Relocate the Docker data-root to the large /mnt volume: this job builds
        # 4 images (noble/resolute x amd64/arm64) and `docker system prune`s
        # between them, so the default disk fills up.
        - task: Bash@3
          displayName: "Setup docker"
          inputs:
            targetType: "inline"
            script: |
              set -x
              sudo service docker stop
              sudo mkdir -p /etc/docker
              echo '{ "data-root": "/mnt/docker" }' | sudo tee /etc/docker/daemon.json
              sudo service docker start

        - bash: ./build.sh --download-driver
          displayName: "Download the driver"

        - task: AzureCLI@2
          displayName: "Login to ACR via OIDC"
          inputs:
            azureSubscription: "Playwright-CDN"
            scriptType: "bash"
            scriptLocation: "inlineScript"
            inlineScript: "az acr login --name playwright"

        - task: Bash@3
          displayName: "Register QEMU (binfmt) for arm64 cross-build"
          inputs:
            targetType: "inline"
            script: "docker run --rm --privileged ${ACR_CACHE_PREFIX}tonistiigi/binfmt --install arm64"
          env:
            ACR_CACHE_PREFIX: "playwright.azurecr.io/cached/"

        # The images are based on mcr.microsoft.com/dotnet/sdk, which is not rate
        # limited and has no ACR cache rule, so only the apt mirror is redirected.
        - task: Bash@3
          displayName: "Build & publish Docker images"
          inputs:
            targetType: "inline"
            script: "./utils/docker/publish_docker.sh ${{ parameters.releaseChannel }}"
          env:
            UBUNTU_MIRROR_PREFIX: "azure."
